# Flight display service config. Edit, then: sudo systemctl restart flight-display

[home]
# Herts for testing. Dad's (near Bournemouth Airport) roughly 50.78, -1.84: set his exact house before handover.
lat = 51.80
lon = -0.20

[receiver]
# readsb/tar1090 live data. A local file path also works (handy for testing).
aircraft_url = "http://localhost/tar1090/data/aircraft.json"
poll_seconds = 1.0
# Ignore positions older than this (seconds).
max_position_age = 30
# Keep a military contact with no position on screen for this long after its last message.
max_no_position_age = 60

[display]
# Only aircraft within this distance count as "overhead".
radius_km = 15
# Keep the current aircraft unless another is closer by at least this much (stops flicker).
switch_margin_km = 0.5
# Port the Matrix Portal polls: http://<pi-ip>:<port>/display.json
port = 8080

[discovery]
# Broadcast this Pi's address so the Matrix Portal finds it without a fixed IP.
enabled = true
port = 50222

[debug]
# true = log every broadcast, Portal request and display change (journalctl -u flight-display -f).
# The /debug page works either way.
verbose = false

[alerts]
# "Look out the window": below this altitude AND within this distance.
low_alt_ft = 3000
low_dist_km = 2.0
# Military alerts can come from further away than radius_km.
military_radius_km = 40
# 7500 (hijack) must persist this many seconds before alerting (avoids fat-finger squawks).
hijack_persist_seconds = 10
# 7700 / 7600 must persist this long.
emergency_persist_seconds = 2

[watchlist]
# Callsign regexes treated as military / special (red/white/blue banner).
# Red Arrows patterns are a best guess: verify against what you see on the map in display season.
callsigns = ["^RED\\d", "^RRR"]
# Callsign -> name shown on the banner when matched (prefix match).
names = { RED = "RED ARROWS", RRR = "RAF" }
# Specific ICAO hex codes to always flag (lowercase), e.g. a friend's aircraft.
hexes = []
# UK military ICAO block (43C000-43CFFF) counts as military even without the database flag.
uk_military_hex_block = true

[brightness]
# 0.0 = off, 1.0 = full. Each entry applies from that time until the next one (24 h clock).
schedule = [
  ["07:00", 0.6],
  ["18:30", 0.35],
  ["22:00", 0.1],
  ["23:30", 0.0],
]

[weather]
enabled = true
refresh_minutes = 15

[lookups]
# adsbdb.com route and aircraft lookups (free, no key). Cached on disk.
enabled = true
cache_days = 7

[state]
# Daily stats + lookup cache live here so they survive a power cut.
dir = "/var/lib/flight-display"
